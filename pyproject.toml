[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
description = "Self-hosted LAN monitoring daemon — device discovery, presence, and bandwidth, with no external egress."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Terry" }]
keywords = ["network", "monitoring", "lan", "arp", "bandwidth", "daemon", "self-hosted"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dynamic = ["version"]
dependencies = [
    "scapy",
    "psutil",
    "netifaces",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
netpulse = "netpulse.cli:main"

[project.urls]
Homepage = "https://github.com/Parrot-R/netPulse"
Source = "https://github.com/Parrot-R/netPulse"

[tool.setuptools.dynamic]
version = { attr = "netpulse.__version__" }

[tool.setuptools.packages.find]
include = ["netpulse*"]

[tool.ruff]
target-version = "py39"
line-length = 100
# The single-file prototype is kept only as a historical reference and is not
# part of the package; it also intentionally contains the un-runnable snippet
# that the split fixed, so it must not be linted.
extend-exclude = ["prototype-netmon.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # long lines in status/log strings carried from the prototype

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # import the in-tree netpulse package without installing it

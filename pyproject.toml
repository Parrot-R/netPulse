[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "1.0.0"
description = "Self-hosted LAN monitoring daemon: device discovery, presence, and bandwidth accounting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "scapy",
    "psutil",
    "netifaces",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
netpulse = "netpulse.cli:main"

[tool.setuptools.packages.find]
include = ["netpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's own default selection --
# that default has changed between minor ruff releases (verified: 0.15.8
# selects only these four groups, 0.16.3 pulls in a much larger set), so an
# unpinned `pip install ruff` in CI can start failing on nothing this repo
# actually regressed. E4/E7/E9 + F is pycodestyle's error-level checks plus
# Pyflakes -- ruff's own long-standing default before that drift.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "1.0.0"
description = "Self-hosted LAN monitoring daemon: device discovery, presence, and bandwidth accounting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "scapy",
    "psutil",
    "netifaces",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
netpulse = "netpulse.cli:main"

[tool.setuptools.packages.find]
include = ["netpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

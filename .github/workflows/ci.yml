name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The test suite exercises only the dependency-free modules (config, db,
      # oui, presence, export), so it needs neither the runtime dependencies
      # (scapy/psutil/netifaces — netifaces in particular needs system build
      # tooling) nor root. Installing just ruff + pytest keeps CI fast and green.
      - name: Install lint and test tools
        run: python -m pip install --upgrade pip ruff pytest

      - name: Lint
        run: ruff check netpulse tests

      - name: Run tests
        run: pytest

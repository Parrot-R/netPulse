<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="netPulse logo">
  <title>netPulse</title>
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="232" height="232" rx="48" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- network spokes: four LAN devices wired to the daemon at center -->
  <g stroke="#334155" stroke-width="2">
    <line x1="60" y1="60" x2="120" y2="120"/>
    <line x1="180" y1="60" x2="120" y2="120"/>
    <line x1="60" y1="180" x2="120" y2="120"/>
    <line x1="180" y1="180" x2="120" y2="120"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="60" cy="60" r="7"/>
    <circle cx="180" cy="60" r="7"/>
    <circle cx="60" cy="180" r="7"/>
    <circle cx="180" cy="180" r="7"/>
  </g>

  <!-- pulse / heartbeat line through the hub -->
  <polyline points="30,120 75,120 90,80 105,160 120,60 135,150 150,120 210,120"
            fill="none" stroke="url(#pulseGrad)" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- daemon hub -->
  <circle cx="120" cy="120" r="10" fill="#f8fafc"/>
  <circle cx="120" cy="120" r="10" fill="none" stroke="url(#pulseGrad)" stroke-width="3"/>
</svg>
